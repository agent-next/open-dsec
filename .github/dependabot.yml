version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
    open-pull-requests-limit: 2
  # sdk/python is a uv project (pyproject.toml + uv.lock, no requirements.txt);
  # dependabot's `uv` ecosystem covers that manifest, `pip` does not.
  - package-ecosystem: uv
    directory: /sdk/python
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
    open-pull-requests-limit: 2
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
    open-pull-requests-limit: 2
